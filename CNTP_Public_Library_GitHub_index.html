<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CNTP Research Library · Preview Access</title><style>
:root{font-family:system-ui,sans-serif;color:#244351;background:#f2f6f7}body{min-height:100vh;display:grid;place-items:center;margin:0}main{background:#fff;box-shadow:0 12px 36px #1838421c;border-radius:14px;padding:32px;width:min(390px,calc(100vw - 70px))}h1{font-size:24px;margin:0 0 10px}p{line-height:1.5}label{display:block;margin:20px 0 8px}input,button{box-sizing:border-box;width:100%;border-radius:8px;padding:12px;font:inherit}input{border:1px solid #a7bfc6}button{margin-top:14px;color:white;background:#20566b;border:0;cursor:pointer}#error{color:#a42f2f;min-height:1.4em}small{color:#627b83}</style></head><body><main><h1>CNTP Research Library</h1><p>Working preview · Visitor access</p><form id="login"><label for="pw">Password</label><input id="pw" type="password" required autocomplete="off"><button type="submit">Enter Library</button><p id="error" role="alert"></p></form><small>Temporary preview screen; not secure access control.</small></main><script>
const hashExpected="dd6670d957f1d101b3cce23783dcf5987c52c4484a949f1b898083a46beec6cc";
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const pw=document.getElementById('pw').value;const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw));const hash=[...new Uint8Array(digest)].map(n=>n.toString(16).padStart(2,'0')).join('');if(hash===hashExpected){location.href='library.html';}else{document.getElementById('error').textContent='Incorrect password.';}});
</script></body></html>
